<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>📜 Libro de Pistas de Hogwarts</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">

<style>

body{
    background:#111;
    color:#d4af37;
    font-family:'Cinzel',serif;
    text-align:center;
    padding:20px;
}

.contenedor{
    max-width:800px;
    margin:auto;
    padding:25px;
    border:2px solid #d4af37;
    background:#1a1a1a;
    border-radius:10px;
}

.logo{
    width:140px;
    display:block;
    margin:auto;
}

h1{
    margin-top:20px;
}

#texto{
    margin-top:20px;
    font-size:22px;
    line-height:1.8;
}

input{
    width:100%;
    padding:12px;
    margin-top:20px;
    border:none;
    border-radius:5px;
    font-size:18px;
    text-align:center;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    background:#d4af37;
    border:none;
    cursor:pointer;
    border-radius:5px;
    font-size:16px;
    font-weight:bold;
}

button:hover{
    background:#f0c75d;
}

#resultado{
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
}

#ayuda{
    display:none;
    margin-top:20px;
    color:#ffd700;
    font-size:18px;
}

.correcto{
    color:#6dff7b;
}

.incorrecto{
    color:#ff6d6d;
}

@media(max-width:600px){

    #texto{
        font-size:18px;
    }

    h1{
        font-size:28px;
    }

    input{
        font-size:16px;
    }
}

</style>

</head>

<body>

<audio id="music" loop>
    <source src="./music.mp3" type="audio/mpeg">
</audio>

<button onclick="toggleMusic()">
🎵 Activar / Desactivar Música
</button>

<div class="contenedor">

<img src="hogwarts.png" class="logo">

<h1>📜 Libro de Pistas de Hogwarts 📜</h1>

<h2 id="titulo"></h2>

<div id="texto"></div>

<input
id="respuesta"
placeholder="Escribe tu respuesta...">

<button onclick="comprobar()">
🪄 Comprobar
</button>

<button onclick="mostrarAyuda()">
🦉 Pedir Ayuda
</button>

<div id="ayuda"></div>

<div id="resultado"></div>

</div>

<script>

const pistas = {

0:{
titulo:"✉️ El Comienzo de la Aventura ✉️",

texto:`
Bienvenida, joven bruja.

<br><br>

El Ministerio de Magia necesita tu ayuda.

<br><br>

Seis secretos han sido ocultados por el mundo muggle.

<br><br>

Solo quien resuelva cada enigma podrá encontrar el camino.

<br><br>

Tu primera prueba ya te espera.

<br><br>

La primera localizacion porta el nombre del niño que sobrevivio.
`,

ayuda:`
🦉 Ayuda:

<br><br>

Es una plaza.
`,

respuesta:"harry walker",

destino:"⚡ COMIENZA LA BÚSQUEDA ⚡"
},

    
1:{
titulo:"🔐 Mensaje Encriptado 🔐",

texto:`
SIGUIENTE PISTA

<br><br>

26 - 15 - 14 - 1

<br>

22 - 5 - 18 - 4 - 5

<br><br>

📜 Descifra el mensaje oculto para continuar.
`,

ayuda:`
🦉 Ayuda:

<br><br>

Piensa en el abecedario.
`,

respuesta:"zona verde",

destino:"TRAS"
},

2:{
titulo:"🌳 Los Nueve Guardianes 🌳",

texto:`
Nueve guardianes permanecen juntos.

<br><br>

No hablan.

<br><br>

No se mueven.

<br><br>

Pero la respuesta tienen.
`,

ayuda:`
🦉 Ayuda:

<br><br>

Quinze + Cinc - Onze.
`,

respuesta:"nou pins",

destino:"CADA"
},

3:{
titulo:"🚇 La Estación Perdida 🚇",

texto:`
No soy una persona,

<br>

pero llevo tu nombre.

<br><br>

No soy Hogwarts,

<br>

pero tengo estación.

<br><br>

No necesitas escoba

<br>

para llegar hasta mí.
`,

ayuda:`
🦉 Ayuda:

<br><br>

Lo usamos para viajar.
`,

respuesta:"metro via julia",

destino:"AVENTURA"
},

4:{
titulo:"🌊 El Susurro del Agua 🌊",

texto:`
Lo que buscas está cerca.

<br><br>

Pero el agua protege aquello que los ojos no pueden encontrar.

<br><br>

Los muggles mirarían la superficie.

<br><br>

Los magos la corriente han de escuchar.
`,

ayuda:`
🦉 Ayuda:

<br><br>

Puedes bañarte si quieres.
`,

respuesta:"fuentes via julia",

destino:"AGUARDA"
},

5:{
titulo:"🏰 El Corazón del Reino 🏰",

texto:`
Has encontrado lo que el agua escondía,

<br>

pero el camino aún no ha terminado.

<br><br>

Ahora busca el lugar donde late el corazón

<br>

de este pequeño reino muggle.

<br><br>

Donde sus caminos se encuentran,

<br>

donde los habitantes se reúnen,

<br>

y donde tantas historias comienzan y terminan.

<br><br>

<strong>Allí te espera el siguiente secreto.</strong>
`,

ayuda:`
🦉 Ayuda:

<br><br>

El centro del barrio.
`,

respuesta:"plaza angel pestaña",

destino:"TU"
},

6:{
titulo:"🏆 La Última Pista 🏆",

texto:`
Lo has conseguido.

<br><br>

Has seguido cada pista.

<br><br>

Has encontrado cada secreto.

<br><br>

Y has llegado hasta el final.

<br><br>

Pero todavía queda un último hechizo.

<br><br>

Todo mago que emprende un viaje necesita saber cuándo regresar.

<br><br>

Tu última pista no te llevará a otro lugar desconocido.

<br><br>

Sigue el camino que tantas veces has recorrido.

<br><br>

<strong>Allí donde comenzó esta aventura.</strong>
`,

ayuda:`
🦉 Ayuda:

<br><br>

Algunos lo llaman casa, otros lo llaman...
`,

respuesta:"hogar",

destino:"🏠 HOGAR"
}

};

const parametro =
new URLSearchParams(window.location.search)
.get("pista") || "1";

const datos = pistas[parametro];

document.getElementById("titulo").innerHTML =
datos.titulo;

document.getElementById("texto").innerHTML =
datos.texto;

document.getElementById("ayuda").innerHTML =
datos.ayuda;

if(datos.ayuda===""){
document.querySelector('button[onclick="mostrarAyuda()"]').style.display="none";
}

function normalizar(texto){

return texto
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.replace(/\s+/g,"")
.trim();

}

function comprobar(){

const valor =
document.getElementById("respuesta").value;

if(
normalizar(valor) ===
normalizar(datos.respuesta)
){

document.getElementById("resultado")
.className="correcto";

document.getElementById("resultado")
.innerHTML=
"✅ Correcto.<br><br>⚡ La magia ha revelado algo:<br><br><strong>"
+
datos.destino
+
"</strong>";

return;
}

document.getElementById("resultado")
.className="incorrecto";

document.getElementById("resultado")
.innerHTML=
"❌ La respuesta no parece correcta. Inténtalo de nuevo.";

}

function mostrarAyuda(){

document.getElementById("ayuda")
.style.display="block";

}

const music=document.getElementById("music");

function toggleMusic(){

if(music.paused){

music.play();

}else{

music.pause();

}

}

document.addEventListener("click",()=>{

if(music.paused){

music.play().catch(()=>{});

}

},{once:true});

</script>

</body>
</html>
