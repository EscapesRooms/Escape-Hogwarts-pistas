<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>📜 Libro de Pistas de Hogwarts</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

</head>

<body>

    <audio id="music" loop>
        <source src="./music.mp3" type="audio/mpeg">
    </audio>

    <button onclick="toggleMusic()">
    🎵 Activar / Desactivar Música
    </button>

    <div class="contenedor">

    <img src="hogwarts.png" class="logo">

    <h1>📜 Libro de Localizaciones 📜</h1>

    <h2 id="titulo"></h2>

    <div id="texto"></div>

    <input
    id="respuesta"
    placeholder="Escribe tu respuesta...">

    <button onclick="comprobar()">
    🪄 Comprobar
    </button>

    <button onclick="mostrarAyuda()">
    🦉 Pedir Ayuda
    </button>

    <div id="ayuda"></div>

    <div id="resultado"></div>

    </div>
    <script src="js/pistas.js" defer></script>
    <script src="js/game.js" defer></script>
</body>
</html>
